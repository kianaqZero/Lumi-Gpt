<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Lumi · 任务对话</title><link rel="stylesheet" href="task-chat.css"></head><body>
<header class="chat-header"><div class="heading-row"><div class="brand-mark" aria-hidden="true">l</div><div class="heading-copy"><div class="eyebrow"><b>lumi</b><span class="divider">/</span><span id="project">任务对话</span></div><h1 id="title">正在打开聊天…</h1></div><div class="header-actions"><button id="refresh" class="quiet" type="button">刷新</button><button id="open-codex" type="button">在 Codex 中打开</button></div></div><div class="meta-row"><div class="connection"><span id="status" role="status">正在连接…</span><small id="target"></small></div><div class="reading-tools"><button id="font-size" class="tool" type="button" title="调整正文字号">Aa <span id="font-value">16</span></button><button id="theme" class="tool theme-toggle" type="button" title="切换深浅色" aria-label="切换深浅色">◐</button></div></div></header>
<section class="reader-shell"><main id="reader" aria-label="聊天记录"><button id="older" type="button" hidden>加载更早消息</button><div id="messages" aria-live="polite"></div><p id="empty">正在读取任务报告…</p></main><button id="latest" type="button" hidden>回到最新 ↓</button></section>
<footer><div class="composer"><label for="draft" id="draft-label">回复这条聊天</label><textarea id="draft" maxlength="32000" rows="2" placeholder="补充要求，或对报告继续提问…"></textarea><div class="compose-actions"><small id="help">Ctrl + Enter 发送 · Enter 换行</small><div class="send-actions"><span id="char-count" aria-hidden="true"></span><button id="send" type="button">发送到 Codex</button></div></div></div><p id="same-chat-note">消息会发送到上方对应的 Codex 聊天</p></footer>
<script src="task-chat-ui.js"></script></body></html>
